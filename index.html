.cv>div{background:#f2f7ff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.cv b{font-size:20px;color:var(--blue)}

#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;direction:rtl;font-size:12px;color:#000;background:#fff}
  #printArea h1{font-size:20px;margin:0 0 4px}#printArea h2{font-size:15px;margin:12px 0 4px;border-bottom:2px solid #0B2A6F;color:#0B2A6F}
  #printArea table{width:100%;border-collapse:collapse}#printArea td,#printArea th{border:1px solid #bbb;padding:3px 5px;vertical-align:top;text-align:right}
  #printArea .by{color:#8a6a00;font-weight:700}
  .day2{break-inside:avoid}
}

const b64u=u8=>{let s="";u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
async function pack(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if("CompressionStream" in window){const cs=new CompressionStream("deflate-raw"),w=cs.writable.getWriter();w.write(raw);w.close();return "z"+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}
  return "p"+b64u(raw);
}
async function unpack(s){
  const k=s[0],u8=unb64u(s.slice(1));
  if(k==="z"){const ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(u8);w.close();return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()))}
  return JSON.parse(new TextDecoder().decode(u8));
}

}

  const key=catKey[kind]; if(f.cat&&key&&p[key]!==f.cat)return false;
  if(f.free&&!/^חינם|חופשית/.test((p.price||"")+" "+(p.free||"")))return false;
  if(f.kids&&!p.kids)return false;
  if(f.open&&isClosedOn(p,todayISO()))return false;

}
function listFor(kind){

  if(kind==="events"&&!f.past){const t=todayISO();arr=arr.filter(x=>(x.endDate||x.date||"9999")>=t)}

let USERPOS=null;
function getPos(force){
  return new Promise(res=>{
    if(!force&&USERPOS&&Date.now()-USERPOS.t<60000)return res(USERPOS);
    if(!navigator.geolocation){toast("המכשיר לא תומך בזיהוי מיקום");return res(null)}
    navigator.geolocation.getCurrentPosition(p=>{USERPOS={lat:p.coords.latitude,lon:p.coords.longitude,t:Date.now()};res(USERPOS)},()=>{toast("לא הצלחנו לזהות את המיקום. בדקו שאישרתם גישה למיקום.");res(null)},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
  });
}
async function resolvePoint(val){
  if(val==="gps"){const p=await getPos();return p?{lat:p.lat,lon:p.lon,name:"המיקום שלי"}:null}
  if(val==="city")return {lat:CITY.lat,lon:CITY.lon,name:CITY.he};
  const p=findItem(val); if(!p||p.lat==null||p.lat==="")return null;
  return {lat:+p.lat,lon:+p.lon,name:nameOf(p),id:val};
}

async function fetchRoute(a,b,mode){
  const prof={walk:["https://routing.openstreetmap.de/routed-foot/route/v1/foot/",5],car:["https://routing.openstreetmap.de/routed-car/route/v1/driving/",24],bike:["https://routing.openstreetmap.de/routed-bike/route/v1/bike/",14]}[mode]||null;
  const coords=pts=>pts.map(p=>p.lon+","+p.lat).join(";");
  if(prof){
    for(const base of [prof[0],mode==="car"?"https://router.project-osrm.org/route/v1/driving/":null]){
      if(!base)continue;
      try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),9000);
        const r=await fetch(base+coords(Array.isArray(a)?a:[a,b])+"?overview=full&geometries=geojson",{signal:ctl.signal});clearTimeout(to);
        const j=await r.json(); if(j.routes&&j.routes[0]){const rt=j.routes[0];return {line:rt.geometry.coordinates.map(c=>[c[1],c[0]]),km:rt.distance/1000,min:rt.duration/60,approx:false}}
      }catch(e){}
    }
  }
  const pts=Array.isArray(a)?a:[a,b]; let km=0; for(let i=1;i<pts.length;i++)km+=hav(pts[i-1].lat,pts[i-1].lon,pts[i].lat,pts[i].lon);
  km*=1.3; const sp=(MODES[mode]||MODES.walk)[3];
  return {line:pts.map(p=>[p.lat,p.lon]),km,min:km/sp*60,approx:true,dashed:true};
}
async function doRoute(p){
  const info=$("#rtInfo"); const fromVal=$("#rtFrom").value, mode=$("#rtMode").value; MS.fromVal=fromVal; MS.mode=mode;
  const to={lat:+p.lat,lon:+p.lon,name:nameOf(p)};
  info.innerHTML=`<div class="rinfo">⏳ מחשב מסלול…</div>`;
  const from=await resolvePoint(fromVal); if(!from){info.innerHTML=`<div class="rinfo" style="background:#fff3e3">לא נמצאה נקודת מוצא. בחרו מקום אחר או אפשרו גישה למיקום.</div>`;return}
  const g=gdir(from,to,mode); $("#rtG").href=g;
  if(MS.gmode){setGMode(true,{from,to,mode})}
  if(mode==="transit"){
    info.innerHTML=`<div class="rinfo">🚇 לתחבורה ציבורית פתחו את המסלול בגוגל מפות: <a href="${g}" target="_blank" rel="noopener" data-keep="1">↗ פתיחה</a><br><button class="btn mini" data-act="guideFromMap" data-from="${esc(fromVal)}" data-to="${esc(p.id)}" style="margin-top:6px">🚇 מדריך מטרו בין התחנות הקרובות</button></div>`;
    MS.route.clearLayers(); L.polyline([[from.lat,from.lon],[to.lat,to.lon]],{color:"#1565C0",weight:4,dashArray:"6 8"}).addTo(MS.route); MS.map.fitBounds(L.latLngBounds([[from.lat,from.lon],[to.lat,to.lon]]).pad(.3)); return;
  }
  const r=await fetchRoute(from,to,mode);
  MS.route.clearLayers();
  L.polyline(r.line,{color:"#fff",weight:10,opacity:.9}).addTo(MS.route);
  L.polyline(r.line,{color:"#1565C0",weight:6,opacity:.95,dashArray:r.dashed?"8 10":null}).addTo(MS.route);
  L.marker([from.lat,from.lon],{icon:L.divIcon({className:"",html:`<div class="nmk" style="background:#2E7D32">A</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(MS.route);
  MS.map.fitBounds(L.latLngBounds(r.line).pad(.25));
  info.innerHTML=`<div class="rinfo">${MODES[mode][0]}: ${fmtKm(r.km)} · כ-${fmtMin(r.min)}${r.approx?` <span class="small muted">(הערכה בקו ישר – אין חיבור לשירות מסלולים)</span>`:""}</div>`;
}

const ST=Object.fromEntries(STATIONS.map(s=>[s.id,s]));
const MET={map:null,wrap:null,lines:{},marks:{},path:null,labels:false,off:{},sel:null};
const GUIDE={from:null,to:"palace"};
let G=null;
function buildGraph(){
  G={adj:{}};
  const add=(a,b,ln,si,sg)=>{(G.adj[a]=G.adj[a]||[]).push({to:b,line:ln,si,sg})};
  for(const [ln,def] of Object.entries(METRO_LINES))def.seqs.forEach((seq,si)=>{for(let i=0;i<seq.length-1;i++){const a=seq[i],b=seq[i+1];if(a===b)continue;add(a,b,ln,si,1);add(b,a,ln,si,-1)}});
}
function termName(line,si,sg,seq){
  const def=METRO_LINES[line],endId=sg>0?seq[seq.length-1]:seq[0];
  if(si===0){ if(sg<0)return def.ends[0]; if(line!=="M5")return def.ends[1]; }
  return ST[endId]?ST[endId].ro:endId;
}
function metroPath(a,b){
  if(!G)buildGraph(); if(a===b)return {legs:[],min:0,stops:0};
  const dist={},prev={},done={}; const Q=[]; const key=(i,l)=>i+"|"+l;
  const lines=id=>[...new Set((G.adj[id]||[]).map(e=>e.line))];
  for(const l of lines(a)){dist[key(a,l)]=0;Q.push([0,a,l])}
  let best=null;
  while(Q.length){
    Q.sort((x,y)=>x[0]-y[0]); const [d,id,l]=Q.shift(), k=key(id,l); if(done[k])continue; done[k]=1;
    if(id===b){best=k;break}
    for(const e of G.adj[id]||[]){ if(e.line!==l)continue; const nk=key(e.to,l),nd=d+2; if(dist[nk]==null||nd<dist[nk]){dist[nk]=nd;prev[nk]={k,e};Q.push([nd,e.to,l])} }
    for(const l2 of lines(id)){ if(l2===l)continue; const nk=key(id,l2),nd=d+4; if(dist[nk]==null||nd<dist[nk]){dist[nk]=nd;prev[nk]={k,e:null};Q.push([nd,id,l2])} }
  }
  if(!best)return null;
  const seq=[]; let k=best; while(prev[k]){seq.unshift({k,p:prev[k]});k=prev[k].k}
  const legs=[]; let cur=null;
  for(const {k,p} of seq){
    const [id,l]=k.split("|");
    if(!p.e){cur=null;continue}
    if(!cur||cur.line!==l){cur={line:l,from:p.k.split("|")[0],to:id,stops:0,si:p.e.si,sg:p.e.sg,path:[p.k.split("|")[0]]};legs.push(cur)}
    cur.to=id;cur.stops++;cur.path.push(id);
  }
  legs.forEach(g=>{const sq=METRO_LINES[g.line].seqs[g.si];g.dir=termName(g.line,g.si,g.sg,sq)});
  return {legs,min:dist[best],stops:legs.reduce((s,g)=>s+g.stops,0)};
}
const lchip=l=>`<span class="lchip" style="background:${METRO_LINES[l].color};color:${METRO_LINES[l].text}">${l}</span>`;

function nearestStations(pt,n){return STATIONS.map(s=>({s,d:hav(pt.lat,pt.lon,s.lat,s.lon)})).sort((a,b)=>a.d-b.d).slice(0,n)}
const walkMin=km=>km*1.3/4.8*60;
async function runGuide(){

const PACE={relaxed:{h:5,start:"10:00",max:3,n:"רגוע"},normal:{h:7,start:"09:30",max:4,n:"רגיל"},intense:{h:9,start:"09:00",max:6,n:"אינטנסיבי"}};
const INTERESTS=[["history","🏛️ היסטוריה"],["architecture","🏰 אדריכלות"],["photo","📸 צילום"],["culture","🎭 תרבות ואמנות"],["music","🎻 מוזיקה"],["parks","🌳 פארקים וטבע"],["food","🍲 אוכל"],["nightlife","🍻 חיי לילה"],["jewish","✡️ מורשת יהודית"],["shopping","🛍️ קניות"],["kids","👨‍👩‍👧 אטרקציות לילדים"]];
const MODE_LBL={walk:"🚶 הליכה",metro:"🚇 מטרו",bus:"🚌 אוטובוס/חשמלית",taxi:"🚕 מונית",car:"🚗 רכב",train:"🚆 רכבת"};
const toMin=t=>{const m=/^(\d+):(\d+)/.exec(t||"");return m?+m[1]*60+ +m[2]:0};
const fmtT=m=>{m=Math.max(0,Math.round(m));return pad(Math.floor(m/60)%24)+":"+pad(m%60)};
let RV=LAST.rv||{v:"list"};  // תצוגת מסלולים: list | new | edit | view
const saveRV=()=>{LAST.rv=RV;saveLast()};

function eventsOn(iso){return items("events").filter(e=>!U.hidden[e.id]&&e.date&&e.date<=iso&&(e.endDate||e.date)>=iso)}
function legInfo(a,b,mode,r){
  const km=hav(a.lat,a.lon,b.lat,b.lon)*1.3, slow=r&&(r.seniors||r.lessWalk); let min;
  if(mode==="walk")min=km/(slow?3.3:4.5)*60;
  else if(mode==="metro"){const sa=nearestStations(a,1)[0],sb=nearestStations(b,1)[0],mp=metroPath(sa.s.id,sb.s.id);min=walkMin(sa.d)+walkMin(sb.d)+3+(mp?mp.min:km*2.5)}
  else if(mode==="bus")min=7+km/14*60;
  else if(mode==="taxi")min=4+km/22*60;
  else if(mode==="car")min=6+km/24*60;
  else if(mode==="train")min=20+km/55*60;
  else min=km/4.5*60;
  return {km:+km.toFixed(1),min:Math.max(1,Math.round(min))};
}
function defaultMode(a,b,r){
  const km=hav(a.lat,a.lon,b.lat,b.lon)*1.3;
  if(km>=40)return r.mode==="car"?"car":"train";
  const slow=r.seniors||r.lessWalk||r.kidsYoung, wmax=slow?.6:1.2;
  if(r.mode==="walk")return "walk"; if(r.mode==="taxi")return km<.4?"walk":"taxi";
  if(km<=wmax)return "walk";
  const sa=nearestStations(a,1)[0],sb=nearestStations(b,1)[0];
  const metroOk=sa&&sb&&sa.s.id!==sb.s.id&&sa.d<=.9&&sb.d<=.9;
  if(metroOk&&legInfo(a,b,"metro",r).min<=legInfo(a,b,"taxi",r).min*1.5)return "metro";
  if(r.mode==="metro"&&metroOk)return "metro";
  return km>2.5||slow?"taxi":"bus";
}
const homePt=r=>{const h=r.hotelId&&findItem(r.hotelId);return h&&h.lat!=null&&h.lat!==""?{lat:+h.lat,lon:+h.lon,name:nameOf(h)}:{lat:CITY.lat,lon:CITY.lon,name:"מרכז העיר"}};
function scheduleDay(r,d){
  let t=toMin(d.trip?"08:00":(PACE[r.pace]||PACE.normal).start), prev=homePt(r);
  for(const s of d.stops){
    const p=findItem(s.id);
    if(!p||p.lat==null||p.lat===""){s.leg=null;s.t=fmtT(t);t+=Math.round((s.dur||1)*60);continue}
    const cur={lat:+p.lat,lon:+p.lon};
    if(!s.mode)s.mode=defaultMode(prev,cur,r);
    s.leg=legInfo(prev,cur,s.mode,r); t+=s.leg.min; s.t=fmtT(t); t+=Math.round((s.dur||1)*60); prev=cur;
  }
}
function nearestRestaurant(pt,used){
  return visItems("restaurants").filter(x=>x.lat!=null&&x.lat!==""&&!used.has(x.id)).map(x=>({x,d:hav(pt.lat,pt.lon,+x.lat,+x.lon)-(x.rank?Math.max(0,8-x.rank)*.05:0)})).sort((a,b)=>a.d-b.d)[0];
}
function insertMeals(r,d,used){
  if(d.trip||!d.stops.length)return;
  scheduleDay(r,d);
  // ארוחת צהריים אחרי העצירה הראשונה שמסתיימת בין 12:15 ל-15:00
  let idx=-1;
  for(let i=0;i<d.stops.length;i++){const e=toMin(d.stops[i].t)+Math.round((d.stops[i].dur||1)*60);if(e>=12*60+15&&e<=15*60&&i<d.stops.length){idx=i;break}}
  if(idx<0){const last=d.stops[d.stops.length-1],e=toMin(last.t)+Math.round((last.dur||1)*60);if(e>=11*60)idx=d.stops.length-1}
  if(idx>=0){const p=findItem(d.stops[idx].id); if(p&&p.lat!=null&&p.lat!==""){const n=nearestRestaurant({lat:+p.lat,lon:+p.lon},used);if(n){used.add(n.x.id);d.stops.splice(idx+1,0,{id:n.x.id,meal:"lunch",dur:1,mode:"walk"})}}}
  const lp=findItem(d.stops[d.stops.length-1].id)||{lat:CITY.lat,lon:CITY.lon};
  const n2=nearestRestaurant({lat:+lp.lat,lon:+lp.lon},used); if(n2){used.add(n2.x.id);d.stops.push({id:n2.x.id,meal:"dinner",dur:1.5})}
}
function planRoute(r){
  const H=homePt(r), pace=PACE[r.pace]||PACE.normal, interests=new Set(r.interests||[]), hasKids=(+r.kids||0)>0;
  const sc=s=>{let v=40-(s.rank||40)*1.2;for(const t of s.tags||[])if(interests.has(t))v+=7;if(interests.has("kids")&&s.kids)v+=5;if(hasKids&&s.kids)v+=4;if(hasKids&&!s.kids)v-=2;if(r.seniors&&/מדרגות/.test(s.note||""))v-=4;if(s.cat==="מוזיאונים"&&!interests.has("culture")&&!interests.has("history"))v-=3;if(s._extra)v-=6;return v};
  const sites=visItems("sites").filter(s=>s.lat!=null&&s.lat!=="");
  const trips=sites.filter(s=>s.zone==="day");
  const pool=sites.filter(s=>s.zone!=="day").concat(
    visItems("markets").filter(m=>m.lat!=null&&m.lat!=="").map(m=>Object.assign({dur:1.5,_extra:1,rank:30,tags:["food"],io:"out"},m)),
    visItems("shopping").filter(m=>m.lat!=null&&m.lat!==""&&m.rank<=3).map(m=>Object.assign({dur:2,_extra:1,rank:35,tags:["shopping"],io:"in"},m)));
  const dates=[];for(let i=0;i<r.days;i++)dates.push(addDays(r.start,i));
  const plan=dates.map(date=>({date,stops:[]}));
  const used=new Set(), usedR=new Set();
  // טיולי יום
  const nTrips=r.dayTrips?(r.days>=8?2:r.days>=4?1:0):0;
  const order=[]; const mid=Math.floor(r.days/2); for(let k=0;k<r.days;k++){const i=k%2?mid-Math.ceil(k/2):mid+Math.floor(k/2);if(i>=0&&i<r.days&&!order.includes(i))order.push(i)}
  for(let k=0;k<r.days&&order.length;k++){if(!order.includes(k))order.push(k)}
  let tripsDone=0;
  for(const t of trips.slice().sort((a,b)=>sc(b)-sc(a))){
    if(tripsDone>=nTrips)break; if(used.has(t.id))continue;
    const di=order.find(i=>!plan[i].stops.length&&!isClosedOn(t,plan[i].date)&&!(wxKind(wxDay(plan[i].date))==="storm"));
    if(di==null)continue;
    plan[di].trip=true; plan[di].stops.push({id:t.id,dur:t.dur||6}); used.add(t.id); tripsDone++;
    let left=(t.dur||6)<7?7-(t.dur||6):0;
    for(const t2 of trips){ if(used.has(t2.id)||left<=0)continue; if((t2.dur||3)<=left&&hav(t.lat,t.lon,t2.lat,t2.lon)<45&&!isClosedOn(t2,plan[di].date)){plan[di].stops.push({id:t2.id,dur:t2.dur||2});used.add(t2.id);left-=t2.dur||2} }
  }
  // ימי עיר
  const budget=pace.h*(r.lessWalk?.9:1);
  plan.forEach((d,di)=>{
    if(d.trip)return;
    const w=wxDay(d.date),kind=wxKind(w),bad=["rain","storm","snow","cold"].includes(kind);
    let avail=pool.filter(s=>!used.has(s.id)&&!isClosedOn(s,d.date));
    if(!avail.length){d.free=true;return}
    const pick=(from,wDist)=>avail.filter(s=>!used.has(s.id)).map(s=>({s,v:sc(s)-hav(from.lat,from.lon,s.lat,s.lon)*wDist+(bad&&s.io==="in"?5:0)-(bad&&s.io==="out"?7:0)+(kind==="nice"&&s.io==="out"?2:0)})).sort((a,b)=>b.v-a.v)[0];
    const a0=pick(H,di===0?1.6:.7); if(!a0)return; const day=[a0.s]; used.add(a0.s.id); let left=budget-(a0.s.dur||1.5)-.4;
    while(day.length<pace.max&&left>.6){
      const last=day[day.length-1];
      const c=avail.filter(s=>!used.has(s.id)&&(s.dur||1.5)<=left&&hav(last.lat,last.lon,s.lat,s.lon)<(r.lessWalk?2.5:3.5)).map(s=>({s,v:sc(s)-hav(last.lat,last.lon,s.lat,s.lon)*3+(bad&&s.io==="in"?5:0)-(bad&&s.io==="out"?7:0)})).sort((a,b)=>b.v-a.v)[0];
      if(!c)break; day.push(c.s); used.add(c.s.id); left-=(c.s.dur||1.5)+.4;
    }
    // סדר: השכן הקרוב ביותר מהמלון
    const ordered=[]; let cur=H,rest=day.slice(); while(rest.length){rest.sort((x,y)=>hav(cur.lat,cur.lon,x.lat,x.lon)-hav(cur.lat,cur.lon,y.lat,y.lon));const n=rest.shift();ordered.push(n);cur=n}
    d.stops=ordered.map(s=>({id:s.id,dur:s.dur||1.5}));
  });
  for(const d of plan){ if(d.free&&!d.stops.length){d.stops=[];continue} d.stops.forEach(s=>{delete s.mode}); insertMeals(r,d,usedR); scheduleDay(r,d) }
  return plan;
}

/* ---------- טופס "מסלול חדש" ---------- */
function wizardHtml(P){
  const hotels=visItems("hotels");
  return `<div class="wiz sect"><div class="sh"><span>${P.id?"⚙️ עריכת פרטי הנסיעה":"➕ בניית מסלול חדש"}</span></div><div class="sb">
   <p class="muted small">ענו על כמה שאלות והמסלול ייבנה בהתאם: תאריכים (לפי מזג האוויר וימי סגירה), הרכב הנוסעים, תחומי עניין ומיקום המלון. אפשר לערוך הכול אחרי כן.</p>
   <div class="g2"><div class="fld"><label class="k">שם המסלול</label><input id="w_name" value="${esc(P.name||"")}" placeholder="למשל: חופשה משפחתית בבוקרשט"></div>
   <div class="fld"><label class="k">כמה ימים? (1–10)</label><select id="w_days">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${P.days==i+1?"selected":""}>${i+1} ${i?"ימים":"יום"}</option>`).join("")}</select></div>
   <div class="fld"><label class="k">תאריך תחילת הטיול (DD/MM/YYYY)</label>${dateField("w_start",P.start)}</div>
   <div class="fld"><label class="k">איפה אתם ישנים?</label><select id="w_hotel"><option value="">עוד לא בחרנו (נתחיל ממרכז העיר)</option>${hotels.map(h=>`<option value="${esc(h.id)}" ${P.hotelId===h.id?"selected":""}>${esc(nameOf(h))}</option>`).join("")}</select></div>
   <div class="fld"><label class="k">מבוגרים</label><input id="w_adults" type="number" min="1" max="20" value="${P.adults||2}"></div>
   <div class="fld"><label class="k">ילדים</label><input id="w_kids" type="number" min="0" max="20" value="${P.kids||0}"></div>
   <div class="fld"><label class="k">גילאי הילדים (למשל 4, 9)</label><input id="w_ages" value="${esc(P.ages||"")}"></div>
   <div class="fld"><label class="k">קצב הטיול</label><select id="w_pace">${Object.entries(PACE).map(([k,v])=>`<option value="${k}" ${(P.pace||"normal")===k?"selected":""}>${v.n} – עד ${v.max} עצירות ביום</option>`).join("")}</select></div>
   <div class="fld"><label class="k">הליכה והתניידות</label><select id="w_walk"><option value="normal" ${!P.lessWalk&&!P.seniors?"selected":""}>רגיל – נוח ללכת</option><option value="less" ${P.lessWalk&&!P.seniors?"selected":""}>פחות הליכה ופחות עליות</option><option value="slow" ${P.seniors?"selected":""}>קשישים / קושי בהליכה</option></select></div>
   <div class="fld"><label class="k">כלי תחבורה מועדף</label><select id="w_mode"><option value="auto" ${!P.mode||P.mode==="auto"?"selected":""}>לפי המרחק (מומלץ)</option><option value="walk" ${P.mode==="walk"?"selected":""}>בעיקר הליכה</option><option value="metro" ${P.mode==="metro"?"selected":""}>מטרו ותחבורה ציבורית</option><option value="taxi" ${P.mode==="taxi"?"selected":""}>מונית</option><option value="car" ${P.mode==="car"?"selected":""}>רכב שכור</option></select></div></div>
   <div class="fld"><label class="k">תחומי עניין (אפשר לבחור כמה)</label><div class="chips" id="w_int">${INTERESTS.map(([k,l])=>`<button type="button" class="chip${(P.interests||[]).includes(k)?" on":""}" data-act="wInt" data-k="${k}">${l}</button>`).join("")}</div></div>
   <label class="row" style="gap:6px;margin:6px 0"><input type="checkbox" id="w_trips" ${P.dayTrips!==false?"checked":""}> לכלול טיולי יום מחוץ לעיר (פלש, בראן, בראשוב) כשהטיול ארוך מ-3 ימים</label>
   <div class="row end">${P.id?`<button class="btn" data-act="rtBack">ביטול</button>`:`<button class="btn" data-act="rtList">ביטול</button>`}<button class="btn pri" id="w_go">${P.id?"🔁 בנייה מחדש לפי הפרטים":"✨ בנו לי מסלול"}</button></div></div></div>`;
}
ACT.wInt=el=>el.classList.toggle("on");
function readWizard(){
  const iso=parseDMY($("#w_start").value); if(!iso){toast("תאריך תחילה לא תקין (DD/MM/YYYY)");return null}
  const wk=$("#w_walk").value;
  return {name:$("#w_name").value.trim(),days:+$("#w_days").value,start:iso,hotelId:$("#w_hotel").value,adults:+$("#w_adults").value||1,kids:+$("#w_kids").value||0,ages:$("#w_ages").value.trim(),pace:$("#w_pace").value,lessWalk:wk==="less"||wk==="slow",seniors:wk==="slow",mode:$("#w_mode").value,interests:$$("#w_int .chip.on").map(c=>c.dataset.k),dayTrips:$("#w_trips").checked,
   kidsYoung:(+$("#w_kids").value>0)&&/\b([0-5])\b/.test($("#w_ages").value)};
}

/* ---------- מסך המסלולים ---------- */
RENDER.routes=v=>{
  if(RV.v==="new"){v.innerHTML=wizardHtml(RV.P||{days:3,start:addDays(todayISO(),1),hotelId:U.myHotel||"",adults:2,kids:0,pace:"normal",dayTrips:true,interests:[]});bindWizard(false);return}
  if(RV.v==="edit"){const r=U.routes.find(x=>x.id===RV.id);if(!r){RV={v:"list"};return RENDER.routes(v)}v.innerHTML=wizardHtml(r);bindWizard(true);return}
  if(RV.v==="view"){const r=U.routes.find(x=>x.id===RV.id);if(!r){RV={v:"list"};return RENDER.routes(v)}v.innerHTML=routeView(r);return}
  v.innerHTML=`<div class="tabhead"><h2>🧭 מסלולים מומלצים</h2></div><div class="intro">בנו מסלול ל-1 עד 10 ימים לפי הרכב הנוסעים, תחומי העניין, המלון והתאריכים. המסלול לוקח בחשבון ימי סגירה ומזג אוויר, וניתן לערוך, לשמור, להדפיס ולשתף.</div>
   <div class="row" style="margin-bottom:10px"><button class="btn pri" data-act="rtNew">➕ מסלול חדש</button><button class="btn" data-act="rtImport">📂 פתיחת מסלול מקובץ</button></div>
   ${U.routes.length?U.routes.map(r=>`<div class="rcard"><h3>${esc(r.name||"מסלול")}</h3><div class="small muted">${r.days} ימים · ${toDMY(r.start)} – ${toDMY(addDays(r.start,r.plan.length-1))} · ${r.adults||1} מבוגרים${r.kids?" · "+r.kids+" ילדים":""}${r.hotelId&&findItem(r.hotelId)?" · 🏨 "+esc(nameOf(findItem(r.hotelId))):""}</div>
     <div class="row" style="margin-top:8px"><button class="btn pri mini" data-act="rtOpen" data-r="${esc(r.id)}">פתיחה</button><button class="btn mini" data-act="rtCopy" data-r="${esc(r.id)}">שכפול</button><button class="btn mini danger" data-act="rtDelete" data-r="${esc(r.id)}">מחיקה</button></div></div>`).join(""):`<div class="empty">עדיין אין מסלולים שמורים.<br>לחצו על "מסלול חדש" כדי להתחיל.</div>`}`;
};
function bindWizard(edit){
  $("#w_go").onclick=()=>{
    const P=readWizard(); if(!P)return;
    if(edit){const r=U.routes.find(x=>x.id===RV.id);Object.assign(r,P,{name:P.name||r.name});r.plan=planRoute(r);saveU();RV={v:"view",id:r.id};saveRV();render();toast("המסלול נבנה מחדש");return}
    const r=Object.assign({id:uid("r"),created:Date.now(),docs:[]},P);r.name=r.name||`טיול בבוקרשט – ${r.days} ${r.days>1?"ימים":"יום"}`;
    r.plan=planRoute(r);U.routes.unshift(r);saveU();RV={v:"view",id:r.id};saveRV();render();window.scrollTo(0,0);toast("המסלול נבנה ונשמר");
  };
}
ACT.rtNew=()=>{RV={v:"new"};saveRV();render();window.scrollTo(0,0)};
ACT.rtList=()=>{RV={v:"list"};saveRV();render();window.scrollTo(0,0)};
ACT.rtBack=()=>{RV={v:"view",id:RV.id};saveRV();render();window.scrollTo(0,0)};
ACT.rtOpen=el=>{RV={v:"view",id:el.dataset.r};saveRV();render();window.scrollTo(0,0)};
ACT.rtParams=()=>{RV={v:"edit",id:RV.id};saveRV();render();window.scrollTo(0,0)};
ACT.rtCopy=el=>{const r=U.routes.find(x=>x.id===el.dataset.r);if(!r)return;const c=JSON.parse(JSON.stringify(r));c.id=uid("r");c.name=(r.name||"מסלול")+" (עותק)";c.created=Date.now();U.routes.unshift(c);saveU();render();toast("נוצר עותק")};
ACT.rtDelete=async el=>{if(await askConfirm("למחוק את המסלול?","מחיקה")){U.routes=U.routes.filter(x=>x.id!==el.dataset.r);saveU();RV={v:"list"};saveRV();render()}};

/* ---------- תצוגת מסלול ועריכה ---------- */
function dayWxHtml(iso){
  const w=wxDay(iso); if(!w)return `<span class="dwx" title="התחזית זמינה עד 16 ימים קדימה">🌡️ אין תחזית עדיין</span>`;
  const i=wmo(w.code); return `<span class="dwx">${i[0]} ${Math.round(w.max)}°/${Math.round(w.min)}° · 💧${w.pp??"–"}% · ${esc(i[1])}</span>`;
}
function routeView(r){
  const hotel=r.hotelId&&findItem(r.hotelId);
  const days=r.plan.map((d,di)=>dayHtml(r,d,di)).join("");
  return `<div class="tabhead"><button class="btn mini" data-act="rtList">← כל המסלולים</button><h2>🧭 ${esc(r.name)}</h2><button class="btn mini" data-act="rtRename">✏️ שם</button></div>
   <div class="rcard"><div class="small">📅 ${wdName(r.start)} ${toDMY(r.start)} – ${wdName(addDays(r.start,r.plan.length-1))} ${toDMY(addDays(r.start,r.plan.length-1))} · ${r.adults||1} מבוגרים${r.kids?" · "+r.kids+" ילדים"+(r.ages?" ("+esc(r.ages)+")":""):""} · קצב ${(PACE[r.pace]||PACE.normal).n}${r.lessWalk?" · פחות הליכה":""}${hotel?"<br>🏨 "+esc(nameOf(hotel)):""}${(r.interests||[]).length?"<br>❤️ "+r.interests.map(k=>(INTERESTS.find(x=>x[0]===k)||[,k])[1]).join(" · "):""}</div>

      <div class="sa"><button data-act="rtUp" data-d="${di}" data-s="${si}" aria-label="למעלה">↑</button><button data-act="rtDown" data-d="${di}" data-s="${si}" aria-label="למטה">↓</button><button data-act="rtDel" data-d="${di}" data-s="${si}" aria-label="מחיקה">✕</button></div></div>`;
  });
  if(ev.length)h+=`<div class="sb" style="padding:8px 12px;background:#e8f8fa">🎟️ אירועים ביום הזה: ${ev.map(e=>`<a href="#" data-act="openItem" data-id="${esc(e.id)}" data-keep="1">${esc(e.he)}</a>${e.time?" ("+e.time+")":""}`).join(" · ")}</div>`;

function routePrintHtml(r){

function wtRender(){
  const iso=WT_DATE, w=wxDay(iso), kind=wxKind(w), wi=w?wmo(w.code):null, rain=["rain","storm","snow","cold"].includes(kind);
  const mine=U.routes.map(r=>({r,d:r.plan.find(x=>x.date===iso)})).filter(x=>x.d&&x.d.stops.length);
  const sc=s=>{let v=40-(s.rank||40)*1.3;if(rain&&s.io==="in")v+=14;if(rain&&s.io==="out")v-=12;if(kind==="nice"&&s.io==="out")v+=5;if(kind==="hot"&&s.io==="in")v+=6;return v};
  const sites=visItems("sites").filter(s=>s.zone!=="day"), open=sites.filter(s=>!isClosedOn(s,iso)).sort((a,b)=>sc(b)-sc(a)), closed=sites.filter(s=>isClosedOn(s,iso)&&s.rank<=19);

  const reason=!w?"אין תחזית לתאריך הזה, ולכן ההמלצות לפי יום בשבוע ושעות פתיחה בלבד.":kind==="storm"?"סופת רעמים צפויה – מומלצים אתרים מקורים בלבד.":kind==="snow"?"צפוי שלג – העדפנו מקומות מקורים והתלבשו חם.":kind==="rain"?"צפוי גשם – העדפנו אתרים מקורים (קחו מטרייה).":kind==="cold"?"קר מאוד – העדפנו אתרים מקורים עם הפסקות חמות.":kind==="hot"?"חם – העדפנו אתרים ממוזגים ופארקים בשעות הבוקר המוקדמות/ערב.":"מזג אוויר נוח – אפשר ליהנות מהליכה בעיר ובפארקים.";
  const ev=eventsOn(iso), eat=visItems("restaurants").slice(0,3), mk=visItems("markets").slice(0,2);
  const row=p=>`<div class="rec"><div class="ph" data-alt="${esc(nameOf(p))}"${p.img?` data-img="${esc(p.img)}"`:""}${!p.img&&p.wiki?` data-w="${esc(JSON.stringify(p.wiki))}"`:""}><span class="phe">${p.emoji||KIND_EMOJI[p._kind]}</span></div><div style="flex:1;min-width:0"><b>${esc(nameOf(p))}</b><div class="small muted">${esc((p.io==="in"?"🏛️ מקורה · ":p.io==="out"?"🌳 בחוץ · ":"")+(p.dur?"כ-"+p.dur+" ש׳ · ":"")+shortOf(p)).slice(0,120)}</div></div><button class="btn mini" data-act="openItem" data-id="${esc(p.id)}">פרטים</button></div>`;
  $("#wtBody").innerHTML=`<div class="row"><span class="small">תאריך:</span>${dateField("wtDate",iso)}<button class="btn mini" id="wtToday">היום</button></div>
   <div class="rinfo" style="margin:8px 0">📅 ${wdName(iso)} ${toDMY(iso)} · ${w?`${wi[0]} ${Math.round(w.max)}°/${Math.round(w.min)}° · ${esc(wi[1])} · 💧${w.pp??"–"}%`:"אין תחזית"}<div class="small" style="font-weight:600">${esc(reason)}</div></div>
   ${mine.length?`<div class="sec2">🧭 לפי המסלול שבניתם</div>${mine.map(({r,d})=>`<div class="rcard" style="margin:6px 0"><b>${esc(r.name)}</b>${d.stops.map(s=>{const p=findItem(s.id);return p?`<div class="small">${esc(s.t||"")} · ${s.meal?"🍽️ ":""}${esc(nameOf(p))}</div>`:""}).join("")}<button class="btn mini pri" data-act="wtOpenRoute" data-r="${esc(r.id)}" style="margin-top:6px">פתיחת המסלול</button></div>`).join("")}`:`<div class="small muted" style="margin:6px 0">אין לכם מסלול שמור לתאריך הזה – הנה המלצות. <a href="#" data-act="wtNewRoute" data-keep="1">בניית מסלול ←</a></div>`}
   <div class="sec2">⭐ המלצות לפי מזג האוויר ויום בשבוע</div>${open.slice(0,6).map(row).join("")||'<div class="empty">אין אתרים פתוחים</div>'}

function phFill(q){
  q=q.trim().toLowerCase();
  $("#phBody").innerHTML=PHRASES.filter(p=>!q||p.join(" ").toLowerCase().includes(q)).map(p=>`<tr><td>${esc(p[0])}</td><td class="lt">${esc(p[1])}</td><td class="pron">${esc(p[2])}</td><td><button class="spk" data-act="speak" data-t="${esc(p[1])}" aria-label="השמעה">🔊</button></td></tr>`).join("")||`<tr><td colspan="4" class="empty">לא נמצא ביטוי</td></tr>`;
}
ACT.speak=el=>{
  if(!("speechSynthesis" in window)){toast("המכשיר לא תומך בהשמעה");return}
  const u=new SpeechSynthesisUtterance(el.dataset.t); u.lang="ro-RO"; u.rate=.85;
  const vs=speechSynthesis.getVoices(), v=vs.find(x=>/^ro/i.test(x.lang)); if(v)u.voice=v; else if(vs.length)toast("אין במכשיר קול רומני – ההשמעה עשויה להישמע לא מדויקת",3200);
  speechSynthesis.cancel(); speechSynthesis.speak(u);
};

/* ---------- כלים ---------- */
const CURS=[["ILS","₪ שקל"],["RON","לאי רומני"],["EUR","€ יורו"],["USD","$ דולר"]];
const per=c=>({EUR:1,RON:FX.eurRon,ILS:FX.eurIls,USD:FX.eurUsd}[c]);
const conv=(a,f,t)=>a/per(f)*per(t);
const num=(n,d)=>Number(n).toLocaleString("en-US",{maximumFractionDigits:d==null?2:d});
let CV={amt:"100",from:"RON"};
RENDER.tools=v=>{
  const A=buildAlerts();
  v.innerHTML=`<div class="tabhead"><h2>🧰 כלים ושיתוף</h2></div>
   <div class="sect"><div class="sh"><span>💱 מחשבון המרה</span><button class="btn mini" data-act="refresh">🔄 עדכון שערים</button></div><div class="sb"><div class="row"><input id="cvAmt" inputmode="decimal" style="width:130px" value="${esc(CV.amt)}"><select id="cvFrom">${CURS.map(([c,l])=>`<option value="${c}" ${CV.from===c?"selected":""}>${l}</option>`).join("")}</select></div><div class="cv" id="cvOut"></div><div class="small muted" id="cvNote" style="margin-top:6px"></div><div class="sec2">לאי ← שקל</div><div class="cv" id="cvQuick"></div></div></div>
   <div class="sect"><div class="sh"><span>🔔 התראות והודעות חשובות</span></div><div class="sb">${A.map(a=>`<div class="alert ${a.lvl}"><span>${a.ico}</span><div>${esc(a.text)}</div></div>`).join("")}<div class="row"><button class="btn mini" data-act="notif">🔔 קבלת התראות במכשיר</button></div><div class="small muted">ההתראות מתעדכנות לפי מזג האוויר, שער המטבע, אירועים קרובים וימי סגירה.</div></div></div>
   <div class="sect"><div class="sh"><span>📤 שיתוף עם חברים</span></div><div class="sb"><div class="row"><button class="btn pri" data-act="shareApp">🔗 שליחת קישור לאפליקציה עם השינויים שלי</button><button class="btn" data-act="shareLoc">📍 שליחת המיקום שלי</button></div><p class="small muted">הקישור פותח את האפליקציה אצל החבר כשהיא כוללת את המקומות, הדירוגים, ההערות והמסלולים שהוספתם.</p></div></div>
   <div class="sect"><div class="sh"><span>💾 גיבוי ושחזור</span></div><div class="sb"><div class="row"><button class="btn" data-act="backup">💾 שמירת השינויים שלי לקובץ</button><button class="btn" data-act="restore">📂 פתיחה מקובץ</button><button class="btn danger" data-act="resetAll">🗑 איפוס כל השינויים</button></div><p class="small muted">כולל מקומות שהוספתם, עריכות, דירוגים, הערות, מקומות שהסתרתם ומסלולים. בכל שמירה תוכלו לבחור שם ומקום לקובץ.</p></div></div>
   <div class="sect"><div class="sh"><span>ℹ️ על האפליקציה</span></div><div class="sb"><p>בוקרשט, רומניה – מידע למטייל · גרסה ${CITY.version}<br>יוצר: <b style="color:#B8860B">יעקב זוהר</b></p><div class="row"><button class="btn" data-act="install">📲 התקנה על המסך הראשי</button><button class="btn" data-act="refresh">🔄 רענון כל המידע</button></div>
   <p class="small muted">מקורות המידע: אתרים רשמיים של האתרים והמלונות, ויקימסע וויקיפדיה, אתרי כרטיסים ואתרי חדשות. מזג האוויר: Open-Meteo. שערי מטבע: open.er-api.com. מפות: OpenStreetMap. מחירים ושעות עשויים להשתנות – כדאי לוודא באתר הרשמי לפני ההגעה.</p></div></div>`;
  cvFill();
  $("#cvAmt").oninput=e=>{CV.amt=e.target.value;cvFill()}; $("#cvFrom").onchange=e=>{CV.from=e.target.value;cvFill()};
};
function cvFill(){
  const a=parseFloat(String(CV.amt).replace(/,/g,""))||0;
  $("#cvOut").innerHTML=CURS.filter(([c])=>c!==CV.from).map(([c,l])=>`<div><small>${l}</small><br><b>${num(conv(a,CV.from,c))}</b></div>`).join("");
  $("#cvNote").textContent=FX.guess?"⚠️ השער משוער (אין חיבור לשרת השערים). לחצו על 'עדכון שערים' כשיש אינטרנט.":`שער נכון ל-${new Date(FX.t).toLocaleString("he-IL")} · €1 = ${num(FX.eurRon)} לאי = ${num(FX.eurIls)} ₪`;
  $("#cvQuick").innerHTML=[10,50,100,200,500,1000].map(n=>`<div><small>${num(n,0)} לאי</small><br><b>${num(conv(n,"RON","ILS"))} ₪</b></div>`).join("");
}
ACT.notif=async()=>{
  if(!("Notification" in window)){toast("המכשיר לא תומך בהתראות");return}
  const r=await Notification.requestPermission(); toast(r==="granted"?"התראות הופעלו":"לא אושרו התראות"); if(r==="granted")maybeNotify();
};
ACT.alerts=()=>showAlerts();

/* ---------- שיתוף וגיבוי ---------- */
function personalData(){return {hidden:U.hidden,rate:U.rate,note:U.note,edit:U.edit,custom:U.custom,routes:U.routes,attach:U.attach,myHotel:U.myHotel||""}}
async function makeLink(partial){return baseUrl()+"#u="+await pack({v:1,u:partial})}
function mergeData(d){
  let n=0;
  for(const k of ["hidden","rate","note","edit","attach"])if(d[k]&&typeof d[k]==="object"){Object.assign(U[k],d[k]);n+=Object.keys(d[k]).length}
  if(d.custom)for(const k of Object.keys(d.custom)){U.custom[k]=U.custom[k]||[];for(const x of d.custom[k])if(!U.custom[k].some(y=>y.id===x.id)){U.custom[k].push(x);n++}}
  if(d.routes)for(const r of d.routes)if(r&&r.plan&&!U.routes.some(y=>y.id===r.id)){U.routes.push(r);n++}
  if(d.myHotel&&!U.myHotel)U.myHotel=d.myHotel;
  saveU(); return n;
}
ACT.shareApp=async()=>{
  const link=await makeLink(personalData());
  if(location.protocol==="file:")openModal("🔗 קישור לשיתוף",`<p>האפליקציה פתוחה כעת מקובץ במכשיר, ולכן הקישור יעבוד רק אצל מי שיש לו את אותו הקובץ. כדי ששיתוף בקישור יעבוד לכולם יש להתקין את האפליקציה מכתובת אינטרנט. אפשר לשמור את השינויים בקובץ ולשלוח אותו.</p><div class="row"><button class="btn pri" data-act="backup">💾 שמירה לקובץ</button></div>`);
  else{ if(link.length>7000)toast("הקישור ארוך – אם הוא לא נפתח אצל החבר, שמרו את השינויים לקובץ ושלחו אותו",4200); await shareText("בוקרשט – מידע למטייל","הנה הגרסה שלי של מדריך בוקרשט, עם המקומות והמסלולים שהוספתי:",link) }
};
ACT.shareLoc=async()=>{const p=await getPos(true);if(!p)return;await shareText("המיקום שלי","אני נמצא/ת כאן: ","https://www.google.com/maps?q="+p.lat.toFixed(6)+","+p.lon.toFixed(6))};
ACT.backup=()=>saveFileDialog("bucharest-guide-"+todayISO()+".json",JSON.stringify({type:"buc-backup",v:1,u:personalData()},null,1),"application/json");
ACT.restore=()=>pickFile(txt=>{try{const j=JSON.parse(txt);const d=j.u||(j.route?{routes:[j.route]}:null);if(!d)throw 0;const n=mergeData(d);render();updateBell();toast("נטענו "+n+" פריטים")}catch(e){toast("הקובץ אינו תקין")}});
ACT.resetAll=async()=>{if(await askConfirm("למחוק את כל השינויים האישיים (מקומות שהוספתם, עריכות, דירוגים, הערות, מסלולים)? אי אפשר לשחזר.","איפוס")){U=EMPTY_U();for(const k of ["areas","transport"])U.custom[k]=[];saveU();OPEN.clear();RV={v:"list"};render();updateBell();toast("הכול אופס")}};
async function handleHash(){
  const m=/^#u=(.+)$/.exec(location.hash); if(!m)return;
  try{
    const j=await unpack(m[1]), d=j.u||j; history.replaceState(null,"",location.pathname+location.search);
    const cnt=(d.routes||[]).length+Object.values(d.custom||{}).reduce((s,a)=>s+a.length,0)+Object.keys(d.edit||{}).length+Object.keys(d.note||{}).length;
    if(await askConfirm(`התקבלה גרסה מותאמת אישית מחבר (${cnt} שינויים/מסלולים). לטעון אותה לאפליקציה? השינויים שלכם יישמרו ויתמזגו איתה.`,"טעינה")){mergeData(d);render();updateBell();toast("הגרסה המותאמת נטענה")}
  }catch(e){toast("הקישור אינו תקין")}
}

/* ---------- תפריט, התקנה, רענון ---------- */
let DEFERRED=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFERRED=e});
ACT.install=async()=>{
  if(DEFERRED){DEFERRED.prompt();try{await DEFERRED.userChoice}catch(e){}DEFERRED=null;return}
  openModal("📲 התקנה על המסך הראשי",`<p><b>באנדרואיד (כרום):</b> לחצו על ⋮ בדפדפן ← "התקנת אפליקציה" או "הוספה למסך הבית".</p><p><b>באייפון (ספארי):</b> לחצו על כפתור השיתוף ← "הוספה למסך הבית".</p><p><b>במחשב:</b> לחצו על סמל ההתקנה בשורת הכתובת.</p><p class="small muted">אחרי ההתקנה האפליקציה נפתחת כמו כל אפליקציה, וחלק מהמידע זמין גם בלי אינטרנט.</p>`);
};
ACT.menu=()=>openModal("⋮ עוד",`<div class="grid" style="grid-template-columns:1fr 1fr">
  <button class="btn" data-act="mnu" data-a="install">📲 התקנה</button><button class="btn" data-act="mnu" data-a="shareApp">🔗 שיתוף האפליקציה</button>
  <button class="btn" data-act="mnu" data-a="shareLoc">📍 שליחת המיקום שלי</button><button class="btn" data-act="mnu" data-a="backup">💾 גיבוי לקובץ</button>
  <button class="btn" data-act="mnu" data-a="restore">📂 פתיחה מקובץ</button><button class="btn" data-act="mnu" data-a="tools">🧰 כלים והמרת מטבע</button></div>
  <p class="small muted" style="margin-top:10px">בוקרשט, רומניה – מידע למטייל · גרסה ${CITY.version}<br>יוצר: <b style="color:#B8860B">יעקב זוהר</b></p>`);
ACT.mnu=el=>{closeModal();const a=el.dataset.a;if(a==="tools")go("tools");else ACT[a]&&ACT[a](el)};
ACT.refresh=async()=>{
  const b=$("#refBtn"); if(b.classList.contains("spin"))return; b.classList.add("spin");
  try{
    for(const k of Object.keys(PH))if(PH[k]===0)delete PH[k]; savePH();
    await Promise.all([loadWeather(true),loadFX(true)]); renderWeather(); updateBell();
    try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}
    render(); toast(FX.guess&&!navigator.onLine?"אין חיבור לאינטרנט – מוצג המידע השמור":"המידע רוענן: מזג אוויר, שערי מטבע, התראות והמלצות");
  }finally{b.classList.remove("spin")}
};

/* ---------- הפעלה ---------- */
function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}}
function boot(){
  $("#ver").textContent=CITY.version;
  renderNav(); renderWeather(); updateBell();
  render();
  if(TAB!=="map"&&LAST.y)setTimeout(()=>window.scrollTo(0,LAST.y),200);
  window.addEventListener("scroll",debounce(()=>{LAST.y=Math.round(window.scrollY);saveLast()},400),{passive:true});
  document.addEventListener("visibilitychange",()=>{if(document.hidden){LAST.y=Math.round(window.scrollY);saveLast()}else if(WX&&Date.now()-WX.t>30*60*1000){loadWeather(true).then(()=>{renderWeather();updateBell()})}});
  window.addEventListener("pagehide",()=>{LAST.y=Math.round(window.scrollY);saveLast()});
  window.addEventListener("offline",()=>toast("אין חיבור לאינטרנט – מוצג מידע שמור"));
  window.addEventListener("online",()=>{toast("החיבור חזר");loadWeather(true).then(()=>{renderWeather();updateBell()});loadFX(true).then(()=>renderWeather())});
  loadWeather().then(()=>{renderWeather();updateBell();maybeNotify();if(TAB==="tools")render()});
  loadFX().then(()=>{renderWeather();updateBell();if(TAB==="tools")render()});
  setInterval(()=>{loadWeather(true).then(()=>{renderWeather();updateBell()})},30*60*1000);
  handleHash();
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();

</script>
